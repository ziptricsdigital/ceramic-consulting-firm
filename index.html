  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#9AA3AC;letter-spacing:0.06em\">CERAMIC &amp; GLASS ENGINEERING<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fa>\n    <nav aria-label=\"Primary\">\n      <ul style=\"list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:8px 28px;flex-wrap:wrap\">\n        <li><a href=\"#services\" aria-label=\"Services section\" style=\"font-size:14px;color:#C9CED3;font-weight:500\">Services<\u002Fa><\u002Fli>\n        <li><a href=\"#expertise\" aria-label=\"Expertise section\" style=\"font-size:14px;color:#C9CED3;font-weight:500\">Expertise<\u002Fa><\u002Fli>\n        <li><a href=\"#about\" aria-label=\"About Dr. Ali Nemati section\" style=\"font-size:14px;color:#C9CED3;font-weight:500\">About<\u002Fa><\u002Fli>\n        <li><a href=\"#contact\" aria-label=\"Contact section\" style=\"font-size:14px;color:#C9CED3;font-weight:500\">Contact<\u002Fa><\u002Fli>\n        <li><a href=\"#contact\" aria-label=\"Request Consultation — go to the inquiry form\" style=\"font-size:14px;font-weight:600;background:#E2621B;color:#0E1318;padding:11px 18px;display:flex;align-items:center;gap:10px\" style-hover=\"background:#F07434;color:#0E1318\">Request Consultation <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace\">→<\u002Fspan><\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"main\">\n\n<!-- ============ HERO ============ -->\n<section id=\"top\" aria-labelledby=\"hero-heading\" style=\"background:#0E1318;color:#EDEFF0;border-bottom:1px solid rgba(255,255,255,0.08)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) clamp(40px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(40px,5vw,72px);align-items:stretch\">\n    <div style=\"display:flex;flex-direction:column;justify-content:space-between;gap:40px\">\n      <div style=\"display:flex;flex-direction:column;gap:28px\">\n        <p style=\"margin:0;display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.08em;color:#9AA3AC\">\n          <span aria-hidden=\"true\" style=\"width:8px;height:8px;background:#E2621B\"><\u002Fspan>\n          <span>INDEPENDENT TECHNICAL CONSULTING — LUBBOCK, TX<\u002Fspan>\n        <\u002Fp>\n        <h1 id=\"hero-heading\" style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:clamp(40px,5.6vw,80px);line-height:0.98;letter-spacing:-0.035em;text-wrap:balance\">High-value ceramic &amp; glass engineering consulting.<\u002Fh1>\n        <p style=\"margin:0;font-size:clamp(17px,1.4vw,20px);line-height:1.55;color:#B8BEC4;max-width:560px;text-wrap:pretty\">From powder to performance. Process, microstructure and failure expertise for manufacturers in aerospace, automotive, defense and energy — backed by four decades on the production floor.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:28px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <a href=\"#contact\" aria-label=\"Request a consultation — go to the inquiry form\" style=\"background:#E2621B;color:#0E1318;font-weight:600;font-size:16px;padding:17px 26px;display:flex;align-items:center;gap:14px\" style-hover=\"background:#F07434;color:#0E1318\">Request a consultation <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace\">→<\u002Fspan><\u002Fa>\n          <a href=\"#expertise\" aria-label=\"Explore expertise — view the material domains\" style=\"border:1px solid rgba(255,255,255,0.24);color:#EDEFF0;font-weight:500;font-size:16px;padding:17px 26px\" style-hover=\"border-color:#EDEFF0;color:#EDEFF0\">Explore expertise<\u002Fa>\n        <\u002Fdiv>\n        <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid rgba(255,255,255,0.12)\">\n          <div style=\"padding:18px 20px 0 0;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px\">\n            <dt style=\"font-size:13px;color:#9AA3AC;line-height:1.4\">Hands-on industrial ceramic engineering<\u002Fdt>\n            <dd style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:32px;font-weight:600;letter-spacing:-0.02em\">40+ yrs<\u002Fdd>\n          <\u002Fdiv>\n          <div style=\"padding:18px 20px 0 0;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px\">\n            <dt style=\"font-size:13px;color:#9AA3AC;line-height:1.4\">Materials Engineering, Case Western Reserve University<\u002Fdt>\n            <dd style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:32px;font-weight:600;letter-spacing:-0.02em\">Ph.D.<\u002Fdd>\n          <\u002Fdiv>\n        <\u002Fdl>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- ASTRO: use <Image src={semAlumina} loading=\"eager\" fetchpriority=\"high\" /> — this is the LCP image. -->\n    <figure style=\"margin:0;position:relative;min-height:440px;border:1px solid rgba(255,255,255,0.12);background:#12181E;overflow:hidden\">\n      <img src=\"b9f334ec-f9de-441e-ae8b-37d6e7302f68\" width=\"1231\" height=\"848\" loading=\"eager\" decoding=\"async\" alt=\"Scanning electron microscope view of a fractured, sintered alumina surface showing equiaxed grains and intergranular porosity\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block\">\n      <div aria-hidden=\"true\" style=\"position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;background:rgba(14,19,24,0.86);font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.06em;color:#C9CED3\">\n        <span>FIG. 01<\u002Fspan><span>SEM MICROGRAPH<\u002Fspan>\n      <\u002Fdiv>\n      <figcaption style=\"position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:rgba(14,19,24,0.86);font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.06em;color:#C9CED3\">SINTERED Al₂O₃ — FRACTURE SURFACE<\u002Ffigcaption>\n      <span aria-hidden=\"true\" style=\"position:absolute;top:-1px;left:-1px;width:18px;height:18px;border-top:2px solid #E2621B;border-left:2px solid #E2621B\"><\u002Fspan>\n      <span aria-hidden=\"true\" style=\"position:absolute;bottom:-1px;right:-1px;width:18px;height:18px;border-bottom:2px solid #E2621B;border-right:2px solid #E2621B\"><\u002Fspan>\n    <\u002Ffigure>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showProcess }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"border-top:1px solid rgba(255,255,255,0.08)\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:28px clamp(20px,4vw,48px) 36px;display:flex;flex-direction:column;gap:20px\">\n        <p style=\"margin:0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#9AA3AC\">\n          <span>POWDER → PERFORMANCE · FULL-CHAIN COVERAGE<\u002Fspan>\n          <span>ENGAGE AT ANY STAGE<\u002Fspan>\n        <\u002Fp>\n        <!-- STATIC: process stages are fixed copy (or a small \"stages\" list on the home page frontmatter). -->\n        <ol aria-label=\"Engagement stages from powder to service\" style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0\">\n          <sc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <li style=\"border-top:2px solid #2C353E;padding:14px 16px 0 0;display:flex;flex-direction:column;gap:6px;position:relative\">\n              <span aria-hidden=\"true\" style=\"position:absolute;top:-5px;left:0;width:8px;height:8px;background:#E2621B\"><\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#E2621B;letter-spacing:0.06em\">{{ s.code }}<\u002Fspan>\n              <span style=\"font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:17px;font-weight:600;color:#EDEFF0\">{{ s.name }}<\u002Fspan>\n              <span style=\"font-size:13px;color:#9AA3AC;line-height:1.45\">{{ s.note }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n\n<!-- ============ EXPERTISE MATRIX ============ -->\n<section id=\"expertise\" aria-labelledby=\"expertise-heading\" style=\"background:#EDEFF0;color:#11171C\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:48px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px 64px;align-items:end\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.08em;color:#4F5A64\">01 / EXPERTISE MATRIX<\u002Fp>\n        <h2 id=\"expertise-heading\" style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:clamp(32px,3.8vw,52px);line-height:1.02;letter-spacing:-0.03em;text-wrap:balance\">Select your material domain.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#3E4851;max-width:540px;text-wrap:pretty\">From microstructure to properties, and from batch chemistry to finished part. Choose the domain closest to your problem to see the materials, typical engagements and sectors covered.<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isTabs }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-wrap:wrap;border:1px solid #C3C9CE;background:#F6F7F7\">\n        <div style=\"flex:1 1 300px;display:flex;flex-direction:column;border-right:1px solid #C3C9CE\">\n          <div role=\"tablist\" aria-label=\"Material domains\" aria-orientation=\"vertical\" style=\"display:flex;flex-direction:column\">\n            <!-- DECAP CMS: Loop starts here for Expertise collection (src/content/expertise/*.md, sorted by `order`). Tab fields: order, title, formula. -->\n            <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <button type=\"button\" role=\"tab\" id=\"{{ t.tabId }}\" aria-selected=\"{{ t.selected }}\" aria-controls=\"expertise-panel\" aria-label=\"{{ t.aria }}\" sc-camel-on-click=\"{{ t.onSelect }}\" style=\"all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:22px 24px;border-bottom:1px solid #C3C9CE;background:{{ t.bg }};color:{{ t.fg }}\" style-focus=\"outline:2px solid #E2621B;outline-offset:-2px\">\n                <span style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:{{ t.num }}\">{{ t.idx }}<\u002Fspan>\n                <span style=\"display:flex;flex-direction:column;gap:4px\">\n                  <span style=\"font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:19px;font-weight:600;letter-spacing:-0.01em\">{{ t.name }}<\u002Fspan>\n                  <span style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;opacity:0.75\">{{ t.formula }}<\u002Fspan>\n                <\u002Fspan>\n                <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;color:{{ t.num }}\">{{ t.arrow }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <!-- DECAP CMS: Loop ends here for Expertise collection (tabs). -->\n          <\u002Fdiv>\n          <p style=\"margin:auto 0 0;padding:20px 24px;font-size:13px;line-height:1.55;color:#4F5A64\">Not sure which domain applies? Describe the problem in the <a href=\"#contact\" aria-label=\"Go to the inquiry form\" style=\"color:#B5480F;text-decoration:underline;text-underline-offset:3px\">inquiry form<\u002Fa>.<\u002Fp>\n        <\u002Fdiv>\n\n        <!-- DECAP CMS: Expertise entry template — one per src/content/expertise/*.md. Fields: order, title, formula, summary, image, image_alt, fig_caption, engagements[], materials, sectors[]. -->\n        <article role=\"tabpanel\" id=\"expertise-panel\" aria-labelledby=\"{{ d.tabId }}\" style=\"flex:2 1 560px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0\">\n          <div style=\"padding:32px;display:flex;flex-direction:column;gap:24px;border-right:1px solid #DDE1E4\">\n            <header style=\"display:flex;flex-direction:column;gap:10px\">\n              <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#B5480F\">DOMAIN {{ d.idx }}<\u002Fp>\n              <h3 style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1.05\">{{ d.name }}<\u002Fh3>\n              <p style=\"margin:0;font-size:16px;line-height:1.6;color:#3E4851;text-wrap:pretty\">{{ d.summary }}<\u002Fp>\n            <\u002Fheader>\n            <!-- IMAGE PLACEHOLDER → <img src={entry.image} alt={entry.image_alt} loading=\"lazy\" decoding=\"async\" /> -->\n            <figure role=\"img\" aria-label=\"{{ d.alt }}\" style=\"margin:0;position:relative;flex:1;min-height:220px;border:1px solid #C3C9CE;background:repeating-linear-gradient(135deg,#D3D8DC 0 1px,#E6E9EB 1px 10px);display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px\">\n              <span style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.06em;color:#4F5A64\">FIG. {{ d.fig }}<\u002Fspan>\n              <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;color:#3E4851;text-align:center;padding:0 8px\">[ Image: {{ d.image }} ]<\u002Fspan>\n              <\u002Fsc-if>\n              <figcaption style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.06em;color:#4F5A64;text-align:right\">{{ d.figCaption }}<\u002Ffigcaption>\n            <\u002Ffigure>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column\">\n            <div style=\"padding:32px 32px 24px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid #DDE1E4\">\n              <h4 style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:400;letter-spacing:0.06em;color:#4F5A64\">TYPICAL ENGAGEMENTS<\u002Fh4>\n              <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n                <sc-for list=\"{{ d.work }}\" as=\"w\" hint-placeholder-count=\"4\">\n                  <li style=\"display:grid;grid-template-columns:28px 1fr;gap:8px;padding:11px 0;border-top:1px solid #E2E5E7;font-size:15px;line-height:1.45\">\n                    <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#B5480F;padding-top:2px\">{{ w.n }}<\u002Fspan>\n                    <span>{{ w.t }}<\u002Fspan>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Fol>\n            <\u002Fdiv>\n            <div style=\"padding:24px 32px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid #DDE1E4\">\n              <h4 style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:400;letter-spacing:0.06em;color:#4F5A64\">MATERIAL SYSTEMS<\u002Fh4>\n              <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;color:#11171C;line-height:1.6\">{{ d.materials }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:24px 32px 32px;display:flex;flex-direction:column;gap:12px\">\n              <h4 style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:400;letter-spacing:0.06em;color:#4F5A64\">SECTORS<\u002Fh4>\n              <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ d.sectors }}\" as=\"sec\" hint-placeholder-count=\"4\">\n                  <li style=\"font-size:13px;font-weight:500;padding:6px 10px;border:1px solid #9AA3AC;color:#2A333C\">{{ sec }}<\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isGrid }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));border-top:1px solid #C3C9CE;border-left:1px solid #C3C9CE\">\n        <!-- DECAP CMS: Loop starts here for Expertise collection (expanded-grid variant; same fields as above). -->\n        <sc-for list=\"{{ domains }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <article style=\"padding:32px;border-right:1px solid #C3C9CE;border-bottom:1px solid #C3C9CE;background:#F6F7F7;display:flex;flex-direction:column;gap:18px\">\n            <header style=\"display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap\">\n              <h3 style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:26px;font-weight:600;letter-spacing:-0.02em\"><span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;color:#B5480F;margin-right:12px\">{{ g.idx }}<\u002Fspan>{{ g.name }}<\u002Fh3>\n              <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#4F5A64\">{{ g.formula }}<\u002Fp>\n            <\u002Fheader>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3E4851\">{{ g.summary }}<\u002Fp>\n            <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n              <sc-for list=\"{{ g.work }}\" as=\"w\" hint-placeholder-count=\"4\">\n                <li style=\"display:grid;grid-template-columns:28px 1fr;gap:8px;padding:9px 0;border-top:1px solid #E2E5E7;font-size:14px;line-height:1.45\">\n                  <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#B5480F;padding-top:2px\">{{ w.n }}<\u002Fspan>\n                  <span>{{ w.t }}<\u002Fspan>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Fol>\n            <ul aria-label=\"Sectors\" style=\"list-style:none;margin:auto 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ g.sectors }}\" as=\"sec\" hint-placeholder-count=\"4\">\n                <li style=\"font-size:12px;font-weight:500;padding:5px 9px;border:1px solid #9AA3AC;color:#2A333C\">{{ sec }}<\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Farticle>\n        <\u002Fsc-for>\n        <!-- DECAP CMS: Loop ends here for Expertise collection. -->\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n      <h3 style=\"margin:0 8px 0 0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:400;letter-spacing:0.06em;color:#4F5A64\">ALSO IN SCOPE<\u002Fh3>\n      <!-- DECAP CMS: Loop starts here for home.md frontmatter `also_in_scope` (list of strings). -->\n      <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px\">\n        <li style=\"font-size:14px;padding:7px 12px;background:#DDE1E4;color:#2A333C\">Bioceramics<\u002Fli>\n        <li style=\"font-size:14px;padding:7px 12px;background:#DDE1E4;color:#2A333C\">Ceramic matrix composites (CMCs)<\u002Fli>\n        <li style=\"font-size:14px;padding:7px 12px;background:#DDE1E4;color:#2A333C\">Additive-manufactured ceramics<\u002Fli>\n        <li style=\"font-size:14px;padding:7px 12px;background:#DDE1E4;color:#2A333C\">Nano-structured ceramics<\u002Fli>\n        <li style=\"font-size:14px;padding:7px 12px;background:#DDE1E4;color:#2A333C\">Traditional ceramics — tile, sanitaryware, brick<\u002Fli>\n      <\u002Ful>\n      <!-- DECAP CMS: Loop ends here for also_in_scope. -->\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CORE SERVICES ============ -->\n<section id=\"services\" aria-labelledby=\"services-heading\" style=\"background-color:#DDE1E4;background-image:linear-gradient(rgba(14,19,24,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(14,19,24,0.05) 1px,transparent 1px);background-size:24px 24px;color:#11171C;border-top:1px solid #C3C9CE\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:48px 72px;align-items:start\">\n    <!-- Sticky intro is wrapped so it stays confined to its own grid cell: sticks beside the list on desktop, scrolls normally when stacked on mobile. -->\n    <div style=\"align-self:stretch\">\n    <div style=\"position:sticky;top:96px;display:flex;flex-direction:column;gap:24px\">\n      <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.08em;color:#4F5A64\">02 / CORE SERVICES<\u002Fp>\n      <h2 id=\"services-heading\" style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:clamp(32px,3.8vw,52px);line-height:1.02;letter-spacing:-0.03em;text-wrap:balance\">Decision support, not just test data.<\u002Fh2>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:#3E4851;text-wrap:pretty\">CCF focuses where cost and urgency concentrate: lines that aren't yielding, parts that won't qualify, and commitments that need a second technical opinion.<\u002Fp>\n      <!-- IMAGE PLACEHOLDER → <img src=\"/images/schematic-section.jpg\" alt=\"Blueprint-style dimensioned cross-section of a precision ceramic component\" loading=\"lazy\" decoding=\"async\" /> -->\n      <figure role=\"img\" aria-label=\"Blueprint-style dimensioned cross-section of a precision ceramic component\" style=\"margin:0;position:relative;aspect-ratio:4/3;border:1px solid #9AA3AC;background:repeating-linear-gradient(135deg,#C9CFD4 0 1px,#D8DCE0 1px 10px);display:flex;flex-direction:column;justify-content:space-between;padding:14px 16px\">\n        <span style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.06em;color:#3E4851\">DWG. 02 — SECTION A–A<\u002Fspan>\n        <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;color:#2A333C;text-align:center;padding:0 12px\">[ Image: blueprint-style technical schematic — dimensioned cross-section of a precision ceramic component or kiln-car lining, white linework on deep navy. ]<\u002Fspan>\n        <\u002Fsc-if>\n        <figcaption style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.06em;color:#3E4851;text-align:right\">SCALE 1:2 · mm<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;border-top:2px solid #11171C\">\n      <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n        <!-- DECAP CMS: Loop starts here for Core Services collection (src/content/services/*.md, sorted by `order`). Fields: order, code, title, trigger, summary. -->\n        <li>\n          <article aria-labelledby=\"service-troubleshooting\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 16px;padding:32px 0;border-bottom:1px solid #9AA3AC\">\n            <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;color:#B5480F;padding-top:6px\">S—01<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 id=\"service-troubleshooting\" style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.1\">Manufacturing Troubleshooting<\u002Fh3>\n              <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#4F5A64;letter-spacing:0.02em\">WHEN — yield drops, parts crack in firing, or properties drift.<\u002Fp>\n              <p style=\"margin:0;font-size:16px;line-height:1.6;color:#2A333C;text-wrap:pretty\">Root-cause analysis that traces defects back through powder, forming and firing — then corrective actions your line can actually implement.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fli>\n        <li>\n          <article aria-labelledby=\"service-scale-up\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 16px;padding:32px 0;border-bottom:1px solid #9AA3AC\">\n            <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;color:#B5480F;padding-top:6px\">S—02<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 id=\"service-scale-up\" style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.1\">Qualification &amp; Scale-up<\u002Fh3>\n              <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#4F5A64;letter-spacing:0.02em\">WHEN — a lab result has to become a repeatable production part.<\u002Fp>\n              <p style=\"margin:0;font-size:16px;line-height:1.6;color:#2A333C;text-wrap:pretty\">Process windows, equipment selection, procurement support, installation and commissioning — with documentation built for qualification.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fli>\n        <li>\n          <article aria-labelledby=\"service-due-diligence\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 16px;padding:32px 0;border-bottom:1px solid #9AA3AC\">\n            <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;color:#B5480F;padding-top:6px\">S—03<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 id=\"service-due-diligence\" style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.1\">Technical Due Diligence<\u002Fh3>\n              <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#4F5A64;letter-spacing:0.02em\">WHEN — before you commit to a supplier, acquisition or technology.<\u002Fp>\n              <p style=\"margin:0;font-size:16px;line-height:1.6;color:#2A333C;text-wrap:pretty\">Supplier audits and independent review of process capability, quality control and technical risk — reported in plain terms for decision-makers.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fli>\n        <li>\n          <article aria-labelledby=\"service-material-selection\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 16px;padding:32px 0;border-bottom:1px solid #9AA3AC\">\n            <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;color:#B5480F;padding-top:6px\">S—04<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <h3 id=\"service-material-selection\" style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.1\">Material &amp; Process Selection<\u002Fh3>\n              <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#4F5A64;letter-spacing:0.02em\">WHEN — the datasheet alone can't settle the choice.<\u002Fp>\n              <p style=\"margin:0;font-size:16px;line-height:1.6;color:#2A333C;text-wrap:pretty\">Matching material, processing route and design-for-ceramics rules to your load, temperature, environment and cost targets.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fli>\n        <!-- DECAP CMS: Loop ends here for Core Services collection. -->\n      <\u002Fol>\n      <div style=\"padding:24px 0 0 72px;display:flex;flex-direction:column;gap:10px\">\n        <h3 style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:400;letter-spacing:0.06em;color:#4F5A64\">ALSO AVAILABLE<\u002Fh3>\n        <!-- DECAP CMS: home.md frontmatter `also_available` (list of strings, joined with \" · \"). -->\n        <p style=\"margin:0;font-size:15px;line-height:1.7;color:#2A333C\">Design for ceramics · Technical consulting &amp; quality control · Expert witness support · Technical courses, workshops &amp; personal training<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ABOUT — DECAP CMS: SINGLE FILE src/content/pages/about.md ============\n     Frontmatter: eyebrow, name, portrait, portrait_alt, portrait_caption, quote, quote_attribution, facts[] { label, value }\n     Markdown body → the bio paragraph(s).\n     ASTRO: render as <AboutPrincipal /> reading getEntry('pages', 'about'). -->\n<section id=\"about\" aria-labelledby=\"about-heading\" style=\"background:#F6F7F7;color:#11171C;border-top:1px solid #C3C9CE\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:48px 72px;align-items:stretch\">\n    <!-- IMAGE PLACEHOLDER → <img src={about.portrait} alt={about.portrait_alt} loading=\"lazy\" decoding=\"async\" /> -->\n    <figure role=\"img\" aria-label=\"Dr. Ali Nemati examining a ceramic component in a materials laboratory\" style=\"margin:0;position:relative;min-height:480px;background:repeating-linear-gradient(135deg,#1A2129 0 1px,#12181E 1px 10px);display:flex;flex-direction:column;justify-content:space-between;padding:16px 18px\">\n      <span style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.06em;color:#9AA3AC\">PRINCIPAL<\u002Fspan>\n      <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;color:#C9CED3;text-align:center;padding:0 16px\">[ Image: environmental portrait of Dr. Nemati in a lab or clean-room setting — natural posture, examining a component or sample. Muted, cool tones. No handshake / suit stock. ]<\u002Fspan>\n      <\u002Fsc-if>\n      <figcaption style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.06em;color:#9AA3AC\">DR. ALI NEMATI — LUBBOCK, TX<\u002Ffigcaption>\n      <span aria-hidden=\"true\" style=\"position:absolute;top:0;right:0;width:18px;height:18px;border-top:2px solid #E2621B;border-right:2px solid #E2621B\"><\u002Fspan>\n    <\u002Ffigure>\n    <article style=\"display:flex;flex-direction:column;gap:32px\">\n      <header style=\"display:flex;flex-direction:column;gap:18px\">\n        <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.08em;color:#4F5A64\">03 / ABOUT THE PRINCIPAL<\u002Fp>\n        <h2 id=\"about-heading\" style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:clamp(36px,4.4vw,60px);line-height:1;letter-spacing:-0.03em\">Dr. Ali Nemati, Ph.D.<\u002Fh2>\n        <!-- DECAP CMS: markdown body of about.md renders here -->\n        <p style=\"margin:0;font-size:18px;line-height:1.6;color:#2A333C;text-wrap:pretty\">Four decades working where materials science meets the production floor — processing, the physics and chemistry of materials, microstructure–property relationships, and mechanical and electrical property measurement. Every engagement is handled by Dr. Nemati directly, working alongside your engineers to validate results and turn them into decisions.<\u002Fp>\n      <\u002Fheader>\n      <blockquote style=\"margin:0;padding:24px 0;border-top:2px solid #11171C;border-bottom:1px solid #C3C9CE;display:flex;flex-direction:column;gap:12px\">\n        <p style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:clamp(22px,2.2vw,28px);font-weight:500;line-height:1.3;letter-spacing:-0.015em;text-wrap:balance\">“Our main goal is to be decision-making support, rather than testing.”<\u002Fp>\n        <footer style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#4F5A64\">— CCF MISSION<\u002Ffooter>\n      <\u002Fblockquote>\n      <!-- DECAP CMS: Loop starts here for about.md frontmatter `facts` (label, value). -->\n      <dl style=\"margin:0;display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr)\">\n        <dt style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#4F5A64;padding:14px 0;border-bottom:1px solid #DDE1E4\">EDUCATION<\u002Fdt>\n        <dd style=\"margin:0;font-size:15px;line-height:1.5;padding:14px 0;border-bottom:1px solid #DDE1E4\">Ph.D., Materials Engineering — Case Western Reserve University, Cleveland, OH<\u002Fdd>\n        <dt style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#4F5A64;padding:14px 0;border-bottom:1px solid #DDE1E4\">EXPERIENCE<\u002Fdt>\n        <dd style=\"margin:0;font-size:15px;line-height:1.5;padding:14px 0;border-bottom:1px solid #DDE1E4\">40+ years of hands-on industrial ceramic engineering, R&amp;D through production<\u002Fdd>\n        <dt style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#4F5A64;padding:14px 0;border-bottom:1px solid #DDE1E4\">PROJECT ROLE<\u002Fdt>\n        <dd style=\"margin:0;font-size:15px;line-height:1.5;padding:14px 0;border-bottom:1px solid #DDE1E4\">Research, design, equipment selection, procurement, installation and commissioning; technical documentation and standards<\u002Fdd>\n        <dt style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#4F5A64;padding:14px 0;border-bottom:1px solid #DDE1E4\">TEACHING<\u002Fdt>\n        <dd style=\"margin:0;font-size:15px;line-height:1.5;padding:14px 0;border-bottom:1px solid #DDE1E4\">Technical courses, workshops and mentoring for engineering teams<\u002Fdd>\n      <\u002Fdl>\n      <!-- DECAP CMS: Loop ends here for facts. -->\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CONTACT ============ -->\n<section id=\"contact\" aria-labelledby=\"contact-heading\" style=\"background:#0E1318;color:#EDEFF0\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(20px,4vw,48px) 64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:56px 72px\">\n    <div style=\"display:flex;flex-direction:column;justify-content:space-between;gap:48px\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <p style=\"margin:0;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.08em;color:#9AA3AC\">04 / REQUEST CONSULTATION<\u002Fp>\n        <h2 id=\"contact-heading\" style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:600;font-size:clamp(32px,3.8vw,52px);line-height:1.02;letter-spacing:-0.03em;text-wrap:balance\">Describe the engineering challenge.<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:#B8BEC4;max-width:480px;text-wrap:pretty\">Material, process stage and what's going wrong is enough to start. Inquiries are reviewed personally and treated as confidential.<\u002Fp>\n      <\u002Fdiv>\n      <!-- DECAP CMS: settings/contact.json (address, phone, email) — also feeds the JSON-LD block in the page helmet. -->\n      <address style=\"font-style:normal\">\n        <dl style=\"margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);border-top:1px x;flex-direction:column;gap:22px\">\n          <!-- WEB3FORMS: replace with the real access key (public by design; restrict allowed domains in the Web3Forms dashboard). -->\n          <input type=\"hidden\" name=\"access_key\" value=\"YOUR_WEB3FORMS_ACCESS_KEY\">\n          <input type=\"hidden\" name=\"subject\" value=\"New consultation inquiry — ceramicconsult.com\">\n          <input type=\"hidden\" name=\"from_name\" value=\"CCF Website\">\n          <!-- WEB3FORMS (no-JS fallback): <input type=\"hidden\" name=\"redirect\" value=\"https://www.ceramicconsult.com/thank-you\"> -->\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <label for=\"f-name\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#9AA3AC\">NAME<\u002Flabel>\n              <input id=\"f-name\" required=\"required\" name=\"name\" type=\"text\" autocomplete=\"name\" style=\"background:#0E1318;border:1px solid rgba(255,255,255,0.18);color:#EDEFF0;padding:14px;font-size:16px;outline:none;border-radius:0\" style-focus=\"border-color:#E2621B\">\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <label for=\"f-company\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#9AA3AC\">COMPANY<\u002Flabel>\n              <input id=\"f-company\" name=\"company\" type=\"text\" autocomplete=\"organization\" style=\"background:#0E1318;border:1px solid rgba(255,255,255,0.18);color:#EDEFF0;padding:14px;font-size:16px;outline:none;border-radius:0\" style-focus=\"border-color:#E2621B\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <label for=\"f-email\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#9AA3AC\">EMAIL<\u002Flabel>\n            <input id=\"f-email\" required=\"required\" name=\"email\" type=\"email\" autocomplete=\"email\" style=\"background:#0E1318;border:1px solid rgba(255,255,255,0.18);color:#EDEFF0;padding:14px;font-size:16px;outline:none;border-radius:0\" style-focus=\"border-color:#E2621B\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <label for=\"f-challenge\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.06em;color:#9AA3AC\">ENGINEERING CHALLENGE<\u002Flabel>\n            <textarea id=\"f-challenge\" required=\"required\" name=\"message\" rows=\"6\" placeholder=\"e.g. Si₃N₄ parts cracking after sintering — started after a powder lot change.\" style=\"background:#0E1318;border:1px solid rgba(255,255,255,0.18);color:#EDEFF0;padding:14px;font-size:16px;line-height:1.5;outline:none;resize:vertical;border-radius:0\" style-focus=\"border-color:#E2621B\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start\">\n            <input id=\"f-consent\" required=\"required\" name=\"consent\" type=\"checkbox\" value=\"yes\" style=\"width:18px;height:18px;margin:2px 0 0;accent-color:#E2621B\">\n            <label for=\"f-consent\" style=\"font-size:14px;line-height:1.55;color:#B8BEC4\">I consent to having this website store my submitted information so Ceramic Consulting Firm can respond to my inquiry. See the <a href=\"/privacy\" aria-label=\"Read the privacy policy\" style=\"color:#EDEFF0;text-decoration:underline;text-underline-offset:3px\">Privacy Policy<\u002Fa>.<\u002Flabel>\n          <\u002Fdiv>\n          <!-- CAPTCHA (privacy-first; no Google reCAPTCHA): replace this placeholder with\n               <div class=\"cf-turnstile\" data-sitekey=\"YOUR_TURNSTILE_SITE_KEY\" data-theme=\"dark\"><\u002Fdiv>\n               (or hCaptcha: <div class=\"h-captcha\" data-captcha=\"true\"><\u002Fdiv>) and load its script ONLY on this page.\n               Enable the matching provider in the Web3Forms dashboard. -->\n          <div role=\"group\" aria-label=\"Spam protection challenge\" style=\"min-height:72px;border:1px dashed rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.04em;color:#9AA3AC;text-align:center\">\n            <span aria-hidden=\"true\" style=\"width:18px;height:18px;border:1.5px solid #9AA3AC\"><\u002Fspan>\n            <span>CAPTCHA · Cloudflare Turnstile / hCaptcha widget<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n            <p role=\"alert\" style=\"margin:0;font-size:14px;color:#F2A57A\">{{ errorMsg }}<\u002Fp>\n          <\u002Fsc-if>\n          <button type=\"submit\" aria-label=\"Submit consultation inquiry\" style=\"all:unset;cursor:pointer;background:#E2621B;color:#0E1318;font-weight:600;font-size:16px;padding:17px 26px;display:flex;justify-content:space-between;align-items:center\" style-hover=\"background:#F07434\" style-focus=\"outline:2px solid #EDEFF0;outline-offset:3px\">{{ submitLabel }} <span aria-hidden=\"true\" style=\"font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace\">→<\u002Fspan><\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"status\" aria-live=\"polite\" style=\"display:flex;flex-direction:column;gap:16px;min-height:360px;justify-content:center\">\n          <span aria-hidden=\"true\" style=\"width:10px;height:10px;background:#E2621B\"><\u002Fspan>\n          <h3 style=\"margin:0;font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:28px;font-weight:600;letter-spacing:-0.02em\">Inquiry received.<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:#B8BEC4\">Thank you. Expect a reply by email. For urgent production issues, call +1 (806) 786-7195.<\u002Fp>\n          <button type=\"button\" aria-label=\"Send another inquiry\" sc-camel-on-click=\"{{ reset }}\" style=\"all:unset;cursor:pointer;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#E2621B\">← Send another inquiry<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer style=\"background:#0E1318;border-top:1px solid rgba(255,255,255,0.08)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:24px clamp(20px,4vw,48px) 32px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:0.04em;color:#9AA3AC\">\n    <p style=\"margin:0\">© 2026 CERAMIC CONSULTING FIRM “CCF” · MANAGER: DR. ALI NEMATI<\u002Fp>\n    <nav aria-label=\"Footer\">\n      <ul style=\"list-style:none;margin:0;padding:0;display:flex;gap:24px;flex-wrap:wrap\">\n        <li><a href=\"/privacy\" aria-label=\"Privacy policy\">PRIVACY POLICY<\u002Fa><\u002Fli>\n        <li><a href=\"#top\" aria-label=\"Back to top of page\">BACK TO TOP ↑<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;matrixMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Tabs&quot;,&quot;Expanded grid&quot;],&quot;default&quot;:&quot;Tabs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showProcessLine&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showImageNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { active: 0, submitted: false, sending: false, error: '' };\n\n  // DECAP CMS: Expertise collection — one markdown file per entry (src/content/expertise/*.md).\n  domains = [\n    { slug: 'structural', idx: '01', name: 'Structural Ceramics', formula: 'Al₂O₃ · ZrO₂ · Si₃N₄ · SiC', fig: '1A', figCaption: 'ZrO₂ / Al₂O₃ — FINISHED PARTS',\n      summary: 'High-strength, wear- and thermal-shock-resistant components for applications where failure is not an option.',\n      work: ['Powder specification, batching and slurry behavior', 'Forming route: pressing, slip/tape casting, injection molding', 'Sintering cycles, densification and distortion', 'Fracture, porosity and microstructure–property analysis'],\n      materials: 'Alumina, zirconia, silicon nitride, silicon carbide',\n      sectors: ['Aerospace', 'Automotive', 'Defense', 'Energy'],\n      image: 'precision-ground zirconia and alumina components — bearing balls, seals, insulators — on a black fixture, macro with raking light',\n      alt: 'Precision-ground zirconia and alumina ceramic components on a black fixture' },\n    { slug: 'functional', idx: '02', name: 'Functional Ceramics', formula: 'Dielectric · Piezo · Ferrite', fig: '2A', figCaption: 'PZT — POLISHED CROSS-SECTION',\n      summary: 'Ceramics engineered for electrical, magnetic and electromechanical performance.',\n      work: ['Composition and dopant strategy', 'Electrical property measurement and interpretation', 'Grain-size and phase control for dielectric / piezo response', 'Yield loss and property drift in production'],\n      materials: 'Electroceramics, dielectrics, piezoelectrics, ferrites',\n      sectors: ['Automotive', 'Defense', 'Energy', 'Appliance'],\n      image: 'polished cross-section of a multilayer capacitor or PZT disc, SEM backscatter showing electrode layers',\n      alt: 'Backscatter electron image of a polished multilayer ceramic capacitor cross-section showing electrode layers' },\n    { slug: 'glass', idx: '03', name: 'Glass & Glass-Ceramics', formula: 'SiO₂-based · Controlled crystallization', fig: '3A', figCaption: 'GLASS-CERAMIC — POLARIZED LIGHT',\n      summary: 'Composition, melting and nucleation control — from batch chemistry to a finished, stable part.',\n      work: ['Batch and composition design', 'Defects: stones, cord, seeds, devitrification', 'Heat-treatment schedules for controlled crystallization', 'Thermal expansion and thermal-shock matching'],\n      materials: 'Silicate glasses, glass-ceramics, sealing glasses',\n      sectors: ['Aerospace', 'Building', 'Appliance', 'Energy'],\n      image: 'glass-ceramic panel under cross-polarized light revealing residual stress fringes, clean-room bench background',\n      alt: 'Glass-ceramic panel under cross-polarized light showing residual stress fringes' },\n    { slug: 'refractories', idx: '04', name: 'Refractories', formula: 'Shaped · Monolithic · Kiln furniture', fig: '4A', figCaption: 'POST-MORTEM — SLAG PENETRATION',\n      summary: 'Linings and kiln furniture that survive heat, slag and repeated thermal cycling.',\n      work: ['Material selection for service conditions', 'Corrosion, spalling and thermal-shock failure analysis', 'Installation, dry-out and heat-up practice', 'Service-life extension and cost of ownership'],\n      materials: 'Alumina-silica, basic, SiC-based and castable systems',\n      sectors: ['Energy', 'Building', 'Glass & metals production'],\n      image: 'sectioned post-service refractory brick showing hot-face slag penetration zone, ruler for scale',\n      alt: 'Sectioned refractory brick after service showing the slag penetration zone at the hot face' }\n  ];\n\n  stages = [\n    { code: 'S1', name: 'Powder', note: 'Purity, particle size, batching' },\n    { code: 'S2', name: 'Forming', note: 'Pressing, casting, molding' },\n    { code: 'S3', name: 'Sintering', note: 'Firing cycles, densification' },\n    { code: 'S4', name: 'Finishing', note: 'Grinding, machining, coating' },\n    { code: 'S5', name: 'Qualification', note: 'Properties, QC, standards' },\n    { code: 'S6', name: 'Service', note: 'Failure analysis, service life' }\n  ];\n\n  // WEB3FORMS: progressive enhancement. With the placeholder key the preview simulates success.\n  async submit(e) {\n    e.preventDefault();\n    const form = e.currentTarget;\n    const data = new FormData(form);\n    if (data.get('access_key') === 'YOUR_WEB3FORMS_ACCESS_KEY') { this.setState({ submitted: true, error: '' }); return; }\n    this.setState({ sending: true, error: '' });\n    try {\n      const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { Accept: 'application/json' }, body: data });\n      const json = await res.json();\n      if (!json.success) throw new Error(json.message || 'Submission failed');\n      form.reset();\n      this.setState({ submitted: true, sending: false });\n    } catch (err) {\n      this.setState({ sending: false, error: 'Something went wrong sending your inquiry. Please try again or email alinemati1959@gmail.com.' });\n    }\n  }\n\n  renderVals() {\n    const mode = this.props.matrixMode ?? 'Tabs';\n    const withWork = d => ({ ...d, tabId: 'tab-' + d.slug, work: d.work.map((t, i) => ({ n: String(i + 1).padStart(2, '0'), t })) });\n    const domains = this.domains.map(withWork);\n    const tabs = domains.map((d, i) => {\n      const on = i === this.state.active;\n      return { idx: d.idx, name: d.name, formula: d.formula, tabId: d.tabId,\n        selected: on ? 'true' : 'false', aria: 'Show ' + d.name + ' expertise',\n        bg: on ? '#0E1318' : 'transparent', fg: on ? '#EDEFF0' : '#11171C',\n        num: on ? '#E2621B' : '#4F5A64', arrow: on ? '→' : '',\n        onSelect: () => this.setState({ active: i }) };\n    });\n    return {\n      stages: this.stages,\n      showProcess: this.props.showProcessLine ?? true,\n      showNotes: this.props.showImageNotes ?? true,\n      isTabs: mode === 'Tabs', isGrid: mode !== 'Tabs',\n      tabs, domains, d: domains[this.state.active],\n      submitted: this.state.submitted, notSubmitted: !this.state.submitted,\n      hasError: !!this.state.error, errorMsg: this.state.error,\n      submitLabel: this.state.sending ? 'Sending…' : 'Submit inquiry',\n      onSubmit: e => this.submit(e),\n      reset: () => this.setState({ submitted: false, error: '' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
